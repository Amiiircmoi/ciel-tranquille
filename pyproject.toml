[project]
name = "ciel-tranquille"
version = "0.1.0"
description = "Vitrine analytique du bruit aérien urbain : ingestion micro-batch OpenSky -> DuckDB -> features -> ML -> dashboard."
authors = [{ name = "Amir ANCIAUX" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "geopy>=2.4",
    "streamlit>=1.37",
    "plotly>=5.22",
    "pydeck>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "playwright>=1.44",
]

[project.scripts]
ct-poll = "ciel_tranquille.ingest.poller:main"
ct-build = "ciel_tranquille.storage.build_curated:main"
ct-synth = "ciel_tranquille.ml.synth:main"
ct-train = "ciel_tranquille.ml.train:main"
ct-eval-real = "ciel_tranquille.ml.evaluate_real:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
